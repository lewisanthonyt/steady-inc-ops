<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steady Inc — Operations Platform</title>
<link rel="icon" type="image/png" href="assets/steady-inc-logo.png">
<link rel="apple-touch-icon" href="assets/steady-inc-logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --black:#0a0e1a;
  --charcoal:#12141f;
  --gold:#E11D2A;
  --gold-light:#FF6B73;
  --teal:#00E5CC;
  --teal-dim:#007A80;
  --bg:#0A0E1A;
  --card:#141826;
  --card-alt:#1B2033;
  --input-bg:#10131F;
  --success:#22C55E;
  --warning:#F59E0B;
  --danger:#EF4444;
  --text:#F2F3F5;
  --text-soft:#9CA0AE;
  --border:#262B3D;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  min-height:100vh;
}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== SIDEBAR ===== */
#sidebar{
  width:248px;
  background:linear-gradient(180deg,var(--black) 0%, var(--charcoal) 100%);
  color:#fff;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:100;
  transition:transform .25s ease;
}
.logo-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:22px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo-mark{
  width:38px;height:38px;
  border-radius:9px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#1A1A1A;font-size:17px;
  flex-shrink:0;
}
.logo-text{line-height:1.15;}
.logo-text .l1{font-weight:800;font-size:13.5px;letter-spacing:.5px;color:#fff;}
.logo-text .l2{font-size:9.5px;color:var(--gold-light);letter-spacing:1px;font-weight:600;}

nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-section-label{
  font-size:10px;letter-spacing:1.2px;color:#8c8c8c;
  padding:14px 12px 6px;text-transform:uppercase;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:#cfcfcf;
  margin-bottom:2px;
  transition:background .15s, color .15s;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(184,157,90,.16);color:var(--gold-light);}
.nav-item.active::before{
  content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:var(--gold);border-radius:3px;
}
.nav-item-teal:hover{background:rgba(0,229,204,.08);}
.nav-item-teal.active{background:rgba(0,229,204,.14);color:var(--teal);}
.nav-item-teal.active::before{background:var(--teal);}
.nav-item-purple:hover{background:rgba(167,139,250,.08);}
.nav-item-purple.active{background:rgba(167,139,250,.16);color:#A78BFA;}
.nav-item-purple.active::before{background:#A78BFA;}
.nav-icon{width:18px;text-align:center;font-size:15px;}
.nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:10px;
  padding:1px 6px;border-radius:8px;font-weight:700;
}
.sidebar-footer{
  padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#888;
}
#sidebar-toggle{display:none;}

/* ===== MAIN ===== */
#main{
  margin-left:248px;
  flex:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
#topbar{
  height:68px;
  background:rgba(10,14,26,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  position:sticky;top:0;z-index:50;
}
#topbar h1{font-size:19px;font-weight:700;}
#topbar .sub{font-size:12px;color:var(--text-soft);margin-top:1px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.btn{
  border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1A1A1A;}
.btn-gold:hover{box-shadow:0 4px 14px rgba(184,157,90,.45);transform:translateY(-1px);}
.btn-dark{background:var(--teal-dim);color:#fff;}
.btn-dark:hover{background:var(--teal);color:#001a1a;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--card-alt);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-danger{background:#FEE2E2;color:var(--danger);}
.btn-success{background:#DCFCE7;color:#15803D;}

#content{padding:26px 28px 60px;flex:1;width:100%;max-width:1480px;margin:0 auto;}

/* ===== CARDS / GRID ===== */
.grid{display:grid;gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.kpi-card{position:relative;overflow:hidden;}
.kpi-label{font-size:12px;color:var(--text-soft);font-weight:600;margin-bottom:8px;}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.kpi-delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:7px;}
.kpi-delta.up{color:#15803D;background:#DCFCE7;}
.kpi-delta.down{color:#B91C1C;background:#FEE2E2;}
.kpi-icon{
  position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:17px;
}

/* ===== TABLE ===== */
.card:has(table){overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto;}
th{
  text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--text-soft);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{
  padding:13px 12px;border-bottom:1px solid var(--border);
  word-break:break-word;overflow-wrap:anywhere;max-width:260px;
}
td:has(.pill), td:has(.avatar), td:has(button){max-width:none;white-space:nowrap;}
tr.row-link{cursor:pointer;transition:background .12s;}
tr.row-link:hover{background:var(--card-alt);}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap;
}
.pill-dot{width:6px;height:6px;border-radius:50%;}
/* status colors */
.st-new{background:#EEF2FF;color:#4338CA;}
.st-contacted{background:#FEF3C7;color:#92400E;}
.st-quoted{background:#E0F2FE;color:#0369A1;}
.st-won{background:#DCFCE7;color:#15803D;}
.st-scheduled{background:#F3E8FF;color:#7E22CE;}
.st-active,.st-progress{background:#FFF7ED;color:#C2410C;}
.st-completed{background:#DCFCE7;color:#15803D;}
.st-invoiced{background:#E0E7FF;color:#3730A3;}
.st-paid{background:#DCFCE7;color:#15803D;}
.st-overdue{background:#FEE2E2;color:#B91C1C;}
.st-draft{background:var(--card-alt);color:var(--text-soft);}
.st-sent{background:#E0F2FE;color:#0369A1;}
.st-declined{background:#FEE2E2;color:#B91C1C;}
.st-onhold{background:#FEF3C7;color:#92400E;}
.st-cancelled{background:var(--card-alt);color:var(--text-soft);}
.st-expired{background:#FEE2E2;color:#B91C1C;}
.st-expiring{background:#FEF3C7;color:#92400E;}
.st-valid{background:#DCFCE7;color:#15803D;}
.priority-high{background:#FEE2E2;color:#B91C1C;}
.priority-med{background:#FEF3C7;color:#92400E;}
.priority-low{background:var(--card-alt);color:var(--text-soft);}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(17,17,17,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;
}
.modal-overlay.open{display:flex;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:slideUp .2s ease;border:1px solid var(--border);
}
.modal.modal-lg{max-width:880px;}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--card);z-index:5;
}
.modal-head h2{font-size:17px;font-weight:800;}
.modal-close{font-size:20px;color:var(--text-soft);background:none;border:none;line-height:1;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--card);}

.form-group{margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
label{font-size:12px;font-weight:700;color:var(--text-soft);display:block;margin-bottom:5px;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;background:var(--input-bg);color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);border-color:var(--gold);}
textarea{resize:vertical;min-height:64px;}

/* ===== TABS ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-soft);border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab-btn.active{color:var(--gold-light);border-bottom-color:var(--gold);}

/* ===== KANBAN ===== */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{min-width:230px;flex-shrink:0;}
.kanban-col-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-soft);margin-bottom:10px;display:flex;justify-content:space-between;padding:0 4px;}
.kanban-card{
  background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:9px;
  cursor:grab;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.kanban-card:hover{border-color:var(--gold);}
.kanban-card .kc-name{font-weight:700;margin-bottom:4px;}
.kanban-card .kc-meta{font-size:11px;color:var(--text-soft);}
.kanban-card.dragging{opacity:.4;}
.kanban-col.drag-over{background:rgba(0,229,204,.08);border-radius:12px;}

/* ===== PAINT PIPELINE ===== */
.paint-masthead{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 20px;flex-wrap:wrap;}
.paint-masthead img{height:42px;width:auto;object-fit:contain;}
.paint-masthead .pm-x{font-size:20px;font-weight:800;color:var(--text-soft);}
.paint-masthead .pm-wordmark{height:42px;display:flex;align-items:center;padding:0 16px;border:1.5px solid var(--border);border-radius:10px;font-weight:800;letter-spacing:2px;font-size:15px;color:var(--text);}
.paint-masthead .pm-divider{width:1px;height:30px;background:var(--border);}
.margin-lane{position:relative;height:34px;border-radius:17px;overflow:hidden;background:linear-gradient(90deg,#EF4444 0%,#EF4444 var(--lane-low,20%),#F59E0B var(--lane-low,20%),#F59E0B var(--lane-high,35%),#22C55E var(--lane-high,35%),#22C55E 100%);}
.margin-lane-marker{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:translateX(-2px);}
.margin-lane-label{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:800;color:#0a0a0a;text-shadow:0 1px 2px rgba(255,255,255,.4);}
.paint-kanban{display:grid;gap:9px;align-items:start;}
.paint-kanban .kanban-col{min-width:0;}
.paint-kanban .kanban-col-head{font-size:10px;gap:4px;}
.paint-kanban .kanban-card{padding:9px;margin-bottom:7px;}
.paint-kanban .kanban-card .kc-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.paint-kanban .kanban-card .kc-meta{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.paint-kanban .kanban-col.job-divider{border-left:2px dashed var(--border);padding-left:8px;}
.kanban-col.lost-col{opacity:.55;}
.kanban-col.lost-col .kanban-card{border-style:dashed;}
.kanban-col-group-label{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text-soft);margin-bottom:6px;}
@media(max-width:980px){
  .paint-kanban{display:flex;overflow-x:auto;padding-bottom:10px;}
  .paint-kanban .kanban-col{min-width:200px;flex-shrink:0;}
}
.cashflow-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cashflow-row .cf-label{width:150px;font-size:12.5px;color:var(--text-soft);font-weight:600;flex-shrink:0;}
.cashflow-row .cf-track{flex:1;height:16px;background:var(--card-alt);border-radius:8px;overflow:hidden;}
.cashflow-row .cf-fill{height:100%;border-radius:8px;}
.cashflow-row .cf-value{width:90px;text-align:right;font-size:13px;font-weight:700;flex-shrink:0;}
.cashflow-warning{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#FF8A8A;font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:8px;font-weight:600;}
.tc-row{display:grid;grid-template-columns:1.6fr 0.7fr 0.9fr 0.8fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.tc-row input,.tc-row select{padding:7px 9px;font-size:13px;}
.paint-calc-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;padding:14px;background:var(--card-alt);border-radius:10px;}
.paint-calc-summary .pcs-label{font-size:10.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.paint-calc-summary .pcs-value{font-size:16px;font-weight:800;margin-top:3px;}
.paint-notes-list{max-height:340px;overflow-y:auto;margin-bottom:14px;}
.paint-note{padding:11px 0;border-bottom:1px solid var(--border);}
.paint-note:last-child{border-bottom:none;}
.paint-note-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.paint-note-body{font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
.paint-note-form{display:flex;gap:10px;align-items:flex-end;}
.paint-note-form textarea{flex:1;min-height:44px;resize:vertical;}

/* ===== CALENDAR ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-dow{font-size:11px;font-weight:700;color:var(--text-soft);text-align:center;padding:4px 0;text-transform:uppercase;}
.cal-cell{
  background:var(--card);border:1px solid var(--border);border-radius:10px;min-height:96px;padding:7px;font-size:12px;
}
.cal-cell.other-month{background:var(--bg);color:#3D4256;}
.cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.cal-daynum{font-weight:700;margin-bottom:5px;}
.cal-event{
  font-size:10.5px;padding:2px 6px;border-radius:6px;margin-bottom:3px;font-weight:600;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== MISC ===== */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-soft);}
.empty-state .ic{font-size:38px;margin-bottom:10px;}
.flex{display:flex;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.gap-8{gap:8px;}
.muted{color:var(--text-soft);}
.small{font-size:12px;}
.mt-10{margin-top:10px;}
.mb-10{margin-bottom:10px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.line-items-table input{padding:6px 8px;font-size:13px;}
.line-items-table td{padding:5px 6px;max-width:none;}
.line-items-table th{white-space:nowrap;}
.tag-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card-alt);padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;margin:2px;}
.progress-bar{height:7px;background:var(--card-alt);border-radius:6px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:6px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-dim);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 13px;width:260px;}
.search-box input{border:none;background:none;padding:0;font-size:13px;color:var(--text);}
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--card-alt);color:var(--text);border:1px solid var(--border);padding:13px 20px;border-radius:10px;
  font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:2000;display:flex;align-items:center;gap:10px;
  transform:translateY(20px);opacity:0;transition:all .25s;
}
.toast.show{transform:translateY(0);opacity:1;}
.file-thumb{width:100%;aspect-ratio:1;background:var(--card-alt);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.file-thumb img{width:100%;height:100%;object-fit:cover;}
.icon-btn{background:none;border:none;font-size:15px;color:var(--text-soft);padding:4px;border-radius:6px;}
.icon-btn:hover{background:var(--card-alt);color:var(--text);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#2E3346;border-radius:6px;}

/* ---- calculator widget ---- */
.calc-widget{
  position:fixed;top:90px;right:30px;width:220px;background:var(--card);border-radius:14px;
  box-shadow:0 16px 40px rgba(0,0,0,.5);padding:14px;z-index:1500;border:1px solid var(--border);
}
.calc-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text);}
.calc-head .modal-close{font-size:13px;width:22px;height:22px;}
.calc-display{
  width:100%;box-sizing:border-box;text-align:right;font-size:20px;font-weight:700;padding:10px 12px;
  border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--input-bg);color:var(--text);
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-grid button{
  padding:10px 0;border:none;border-radius:8px;background:var(--card-alt);font-size:14px;font-weight:600;cursor:pointer;color:var(--text);
}
.calc-grid button:hover{background:#2A3044;}
.calc-grid button.calc-eq{background:var(--gold);color:#fff;}

.calc-grid button.calc-eq:hover{background:#C8101F;}

@media(max-width:1300px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:980px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #sidebar-toggle{display:block;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  #topbar{padding:0 16px;}
  #content{padding:18px 16px 50px;}
}
@media(max-width:640px){
  #topbar{height:auto;min-height:60px;padding:10px 14px;flex-wrap:wrap;row-gap:8px;}
  #topbar h1{font-size:16px;}

      <line x1="360.0" y1="320.0" x2="560.0" y2="320.0" />
      <line x1="359.1" y1="330.4" x2="556.1" y2="365.1" />
      <line x1="356.4" y1="340.5" x2="544.3" y2="408.9" />
      <line x1="352.0" y1="350.0" x2="525.2" y2="450.0" />

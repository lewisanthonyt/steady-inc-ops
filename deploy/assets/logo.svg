      <line x1="320.5" y1="376.4" x2="388.9" y2="564.3" />
      <line x1="310.4" y1="379.1" x2="345.1" y2="576.1" />
      <line x1="300.0" y1="380.0" x2="300.0" y2="580.0" />
      <line x1="289.6" y1="379.1" x2="254.9" y2="576.1" />

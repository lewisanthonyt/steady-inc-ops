  <!-- forearm -->
  <path d="M 250 470 L 262 340 L 332 332 L 358 462 Z" fill="#0a0a0a" />

  <!-- fist -->
  <g fill="#0a0a0a">
    <path d="M 222 300
             Q 214 252 258 233
             Q 282 220 312 224
             Q 340 216 366 232
             Q 404 236 412 278
             Q 418 318 392 344
             Q 372 360 340 358
             L 252 352
             Q 220 338 222 300 Z" />
    <!-- knuckle separators -->
    <line x1="262" y1="232" x2="264" y2="346" stroke="#E11D2A" stroke-width="5" />
    <line x1="298" y1="222" x2="300" y2="350" stroke="#E11D2A" stroke-width="5" />
    <line x1="335" y1="226" x2="337" y2="352" stroke="#E11D2A" stroke-width="5" />
    <line x1="370" y1="240" x2="372" y2="348" stroke="#E11D2A" stroke-width="5" />
  </g>
  <!-- thumb -->
  <path d="M 232 320 Q 210 330 215 360 Q 222 382 250 380 L 262 350 Q 248 332 232 320 Z" fill="#0a0a0a" />

  <!-- wrench handle (diagonal, lower-left to upper-right) -->
  <g transform="rotate(-32 300 300)">
    <rect x="20" y="282" width="300" height="36" rx="11" fill="#E11D2A" stroke="#0a0a0a" stroke-width="7"/>
    <circle cx="48" cy="300" r="9" fill="#0a0a0a"/>
    <!-- adjusting screw detail -->
    <rect x="300" y="290" width="34" height="20" rx="4" fill="#0a0a0a"/>
  </g>

  <!-- wrench head (jaw), positioned upper-right, matching diagonal -->
  <g transform="translate(355,160) rotate(-32)">
    <rect x="0" y="0" width="150" height="78" rx="14" fill="#E11D2A" stroke="#0a0a0a" stroke-width="7"/>
    <rect x="92" y="-20" width="58" height="118" rx="16" fill="#161616" stroke="#0a0a0a" stroke-width="7"/>
    <rect x="14" y="20" width="62" height="36" rx="6" fill="#0a0a0a"/>
  </g>

  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="64" fill="#0a0a0a" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">STEADYWORKS</textPath>
  </text>

  <text font-family="Arial, sans-serif" font-weight="800" font-size="26" fill="#0a0a0a" letter-spacing="2.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PLUMBING &amp; MAINTENANCE SERVICES</textPath>
